<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{color-scheme:light dark}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>INTAKE</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap");
:root{
  --bg:#F8FAFC; --panel:#FFFFFF;
  /* sidebar. Light mode sits on the page ground, separated by a rule not a slab. */
  --side:#F8FAFC; --side-fg:#4B5563; --side-fg-on:#0B1D3A; --side-mut:#6B7280;
  --side-hov:rgba(11,29,58,.055); --side-act:rgba(11,29,58,.085);
  --side-line:#E5E7EB; --side-mark:#0B1D3A;
  --fg:#0B1D3A; --fg-2:#4B5563; --fg-3:#6B7280;
  --line:#E5E7EB; --line-2:#EEF1F5;
  --ok:#0B7A48; --warn:#B45309; --bad:#B91C1C; --new:#1D4ED8;
  --shadow:0 1px 2px rgba(11,29,58,.06), 0 4px 12px rgba(11,29,58,.05);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070D18; --panel:#0F1A2E; --side:#050A14; --side-fg:#8A9BB5; --side-fg-on:#FFFFFF; --side-mut:#7E92AE;
    --side-hov:rgba(255,255,255,.06); --side-act:rgba(255,255,255,.12);
    --side-line:rgba(255,255,255,.09); --side-mark:#FFFFFF;
    --fg:#E8EDF5; --fg-2:#A8B6CC; --fg-3:#7C8CA6;
    --line:#1C2A44; --line-2:#16233A;
    --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --new:#60A5FA;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#070D18; --panel:#0F1A2E; --side:#050A14; --side-fg:#8A9BB5; --side-fg-on:#FFFFFF; --side-mut:#7E92AE;
  --side-hov:rgba(255,255,255,.06); --side-act:rgba(255,255,255,.12);
  --side-line:rgba(255,255,255,.09); --side-mark:#FFFFFF;
  --fg:#E8EDF5; --fg-2:#A8B6CC; --fg-3:#7C8CA6;
  --line:#1C2A44; --line-2:#16233A;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --new:#60A5FA;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.shell{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:flex-start;gap:10px;padding:4px 8px 18px}
.brand .mk{width:28px;height:28px;flex:0 0 28px;margin-top:1px;color:var(--side-mark)}
.brand .wm{font:500 18px/1 Jost,Inter,sans-serif;letter-spacing:.26em;color:var(--side-fg-on)}
.brand .tag{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mut);margin-top:5px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);font-size:14px;color:var(--side-fg);transition:background .12s,color .12s}
.nav a:hover{background:var(--side-hov);color:var(--side-fg-on)}
.nav a.on{background:var(--side-act);color:var(--side-fg-on);font-weight:500}
.nav a .ic{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav a .ct{margin-left:auto;font-size:11px;color:var(--side-mut);font-variant-numeric:tabular-nums}
.nav .sep{height:1px;background:var(--side-line);margin:9px 12px}
.side-foot{padding:12px 12px 0;font-size:11px;color:var(--side-mut);border-top:1px solid var(--side-line);margin-top:10px;line-height:1.5}
.side-foot .byline{margin-top:9px;padding-top:9px;border-top:1px solid var(--side-line);color:var(--side-mut);letter-spacing:.04em}
.page-foot{margin:auto 26px 0;padding:18px 0 30px;border-top:1px solid var(--line);font-size:11.5px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase}
.scrim{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:14px}
.burger{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);align-items:center;justify-content:center;flex:0 0 34px}
.top h1{margin:0;font:600 19px/1.2 Inter,sans-serif;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.top .sp{margin-left:auto}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-width:200px}
.searchbox input{border:0;background:none;outline:none;font:inherit;font-size:13.5px;color:var(--fg);width:100%}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.iconbtn:hover{border-color:var(--fg-3)}
.wrap{padding:24px 26px 36px;max-width:1220px;width:100%}

.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 13px}
.sec-h h2{margin:0;font:600 12px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.sec-h .n{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.sec-h .more{margin-left:auto;font-size:12.5px;color:var(--fg-3)}
.sec-h .more:hover{color:var(--fg)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;position:relative;transition:border-color .13s,transform .13s,box-shadow .13s}
.card:hover{border-color:var(--fg-3);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-t{display:flex;align-items:center;gap:10px}
.mono{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:600 12px/1 Inter,sans-serif}
.card-nm{font-weight:600;font-size:14px;letter-spacing:-.005em;line-height:1.25}
.card-by{font-size:11.5px;color:var(--fg-3);margin-top:1px}
.card-hl{font-size:13.5px;color:var(--fg-2);line-height:1.42;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.card-f{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:2px}
.fresh{font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.fresh.h{color:var(--ok)} .fresh.m{color:var(--fg-3)} .fresh.s{color:var(--warn)} .fresh.x{color:var(--fg-3);opacity:.65}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:5px;vertical-align:1px}
.pill{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.newflag{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--new);border:1px solid currentColor;border-radius:4px;padding:1px 4px}
.save{margin-left:auto;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--fg-3);position:relative;z-index:3}
.save:hover{background:var(--line-2);color:var(--fg)}
.save.on{color:var(--warn)}
.card-lnk{position:absolute;inset:0;border-radius:var(--r);z-index:2}
.card-lnk:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.card-t,.card-hl{position:relative;z-index:1;pointer-events:none}
.card-f{position:relative;z-index:1;pointer-events:none}
.card-f .save{pointer-events:auto}

/* deals */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.deals{width:100%;border-collapse:collapse;font-size:13.5px;min-width:840px}
table.deals th{text-align:left;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
table.deals td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.deals tr:last-child td{border-bottom:0}
table.deals tr:hover td{background:var(--line-2)}
td.val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.ttl{max-width:460px;line-height:1.4}
.srcbadge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dealcards{display:none;flex-direction:column;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg-2)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* brief */
.brief{max-width:820px}
.bsec{border-top:1px solid var(--line);padding:22px 0}
.bsec:first-of-type{border-top:0;padding-top:6px}
.bsec h3{margin:0 0 11px;font:600 11.5px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.bsec p{margin:0 0 11px;line-height:1.62}
.bsec ul{margin:0;padding-left:19px}
.bsec li{margin-bottom:9px;line-height:1.55}
.tape{display:flex;flex-wrap:wrap;gap:8px}
.tapeitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;min-width:104px}
.tapeitem .n{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.tapeitem .v{font:600 16px/1.2 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:3px}
.tapeitem .c{font-size:12px;font-variant-numeric:tabular-nums}
.c.up{color:var(--ok)} .c.dn{color:var(--bad)}
.tapeline{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--fg);border-radius:var(--r-sm);padding:13px 16px;font-size:15px;line-height:1.5}
.calrow{display:grid;grid-template-columns:74px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.calrow .t{font-variant-numeric:tabular-nums;color:var(--fg-3)}
.calrow .m{font-size:11.5px;color:var(--fg-3);margin-top:2px}
.imp{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;height:fit-content}
.imp.high{color:var(--bad);border:1px solid currentColor}
.imp.med{color:var(--warn);border:1px solid currentColor}
.imp.low{color:var(--fg-3);border:1px solid var(--line)}
.dealrow{border-bottom:1px solid var(--line-2);padding:11px 0}
.dealrow .w{font-weight:600}
.dealrow .num{font-variant-numeric:tabular-nums;color:var(--fg-3);font-size:13px;margin:2px 0}
.dealrow .rt{font-size:13.5px;color:var(--fg-2)}
.lvls{display:flex;flex-wrap:wrap;gap:8px}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:13px}
.lvl b{font-variant-numeric:tabular-nums}
.wl{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:9px;background:var(--panel)}
.wl .tk{font:600 15px/1 Inter,sans-serif;letter-spacing:.02em}
.wl .kv{font-size:12.5px;color:var(--fg-2);margin-top:5px}
.wl .kv b{color:var(--fg)}
.sc{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.vd{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;height:fit-content;flex:0 0 auto}
.vd.right{color:var(--ok);border:1px solid currentColor}
.vd.wrong{color:var(--bad);border:1px solid currentColor}
.vd.open{color:var(--fg-3);border:1px solid var(--line)}
.nosrc{color:var(--fg-3);font-style:italic;font-size:13.5px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px 22px;text-align:center;color:var(--fg-3);font-size:13.5px;line-height:1.6}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:12px 15px;font-size:13.5px;color:var(--fg-2);line-height:1.55;margin-bottom:16px}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.setrow .l{font-weight:500}
.setrow .d{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.setrow .a{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 14px;font-size:13.5px}
.btn:hover{border-color:var(--fg-3)}

@media (max-width:960px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:translateX(0)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(3,8,18,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .burger{display:flex}
  .top{padding:11px 16px;flex-wrap:wrap;row-gap:10px}
  .top h1{font-size:17px}
  .top .sub{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .wrap{padding:18px 16px 28px}
  .page-foot{margin:auto 16px 0}
  .searchbox{min-width:0;flex:1 1 100%;order:9}
  .top .sp{display:none}
  .top #theme{margin-left:auto}
  table.deals{display:none}
  .tablewrap{border:0;background:none;overflow:visible}
  .dealcards{display:flex}
  .grid{grid-template-columns:1fr}
  .calrow{grid-template-columns:66px 1fr;gap:9px}
  .calrow .imp{grid-column:2}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="mk" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 1.6 28.3 8.8v14.4L16 30.4 3.7 23.2V8.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" opacity=".55"/>
        <path d="M9.5 11.5 16 17l6.5-5.5M9.5 17.5 16 23l6.5-5.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="wm">INTAKE</div>
        <div class="tag">Markets &middot; Deals &middot; Research</div>

    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="ttl">Home</h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="sp"></div>
      <div class="searchbox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="Search sources" autocomplete="off">
      </div>
      <button class="iconbtn" id="theme" aria-label="Theme"></button>
    </header>
    <div class="wrap" id="view"></div>
    <footer class="page-foot">By Juan Diego Mogollon</footer>
  </main>
</div>

<script>
/* ============================================================
   INTAKE — rebuilt clean, 27 Aug 2026.
   Single file. No framework, no build step, no external data.

   DATA CONTRACT (what the refresh job may touch):
     LIVE[i].title / .link / .date      <- refreshed daily
     DEALS                              <- rebuilt daily
     BRIEF                              <- rebuilt weekday pre-market
     REFRESHED                          <- ISO stamp, every run
   Everything else is structure. Do not rewrite it.
   Feed URLs now live IN this file (LIVE[i].feed) so the page is
   the single source of truth and no job needs an external list.
   ============================================================ */

/* ------------------------------------------------------------------
   Data is injected here at build time from data/*.json by src/build.mjs.
   Each file has exactly one writer, so nothing ever collides:
     data/sources.json  structure, the 70 feeds        (rarely, by hand)
     data/live.json     newest item per feed           (GitHub Actions, daily)
     data/deals.json    the M&A wire                   (Claude routine)
     data/brief.json    the SCREENER brief             (Claude routine)
     data/meta.json     refresh stamp + run note       (whoever ran last)
     data/ref.json      reference tiles + spotify pins (by hand)
   ------------------------------------------------------------------ */

latest PE funds","link":"https://www.privateequitywire.co.uk/goldman-sachs-alternatives-raises-11-7bn-across-latest-pe-funds/","date":"2026-09-16T08:09:01Z"},{"src":"PR Newswire","type":"M&A","industry":"—","region":"—","value":"Undisclosed","title":"Brightstar Lottery PLC Announces Results of Tender Offer","link":"https://www.prnewswire.com/news-releases/brightstar-lottery-plc-announces-results-of-tender-offer-302879871.html","date":"2026-09-16T08:00:00Z"},{"src":"PE Hub","type":"Strategic Investment","industry":"—","region":"—","value":"Undisclosed","title":"Adelis Equity Partners agrees majority stake in consultancy alliance Newground","link":"https://www.pehub.com/adelis-equity-partners-agrees-majority-stake-in-consultancy-alliance-newground/","date":"2026-09-16T07:58:51Z"},{"src":"PE Hub","type":"M&A","industry":"Financials","region":"Europe","value":"Undisclosed","title":"Pollen Street-backed OrderYOYO completes bolt-on acquisition of Dutch payments firm Cashdesk","link":"https://www.pehub.com/pollen-street-backed-orderyoyo-completes-bolt-on-acquisition-of-dutch-payments-firm-cashdesk/","date":"2026-09-16T07:46:55Z"}],"brief":{"status":"live","session":"Tuesday, September 15, 2026","builtAt":"2026-09-15T11:50:00Z","tape":[{"n":"S&P 500","v":"7,619.98","c":"−0.5% Mon","dir":"dn"},{"n":"Nasdaq Comp","v":"26,186.41","c":"−0.6% Mon","dir":"dn"},{"n":"Dow","v":"52,421.20","c":"−152.09 Mon","dir":"dn"},{"n":"US 10Y","v":"5.02%","c":"highest since 2007, Tue AM","dir":"up"},{"n":"Brent","v":"$106.93","c":"+1.2% Tue AM","dir":"up"},{"n":"Gold","v":"$4,263","c":"−0.8% Tue, 1-mo low","dir":"dn"}],"tapeLine":"The 10-year cleared its own 2023 high to touch 5.02% Tuesday, the highest since 2007, as Fed funds futures priced Wednesday's hike at roughly 94.5%, up from 87.3% a day earlier. Oil held near six-week highs after the Associated Press and Reuters both reported the Saudi pipeline could take three to six weeks to repair &mdash; not the &ldquo;soon&rdquo; the U.S. energy secretary suggested Monday. Stocks fell Monday on the AI-slowdown story before President Trump and China&rsquo;s foreign ministry both rejected it outright, and futures point lower again this morning. New York&rsquo;s Empire State index swung negative for the first time since June, and Sequence Holdings and Michael Dell&rsquo;s family office agreed to take insurance broker Baldwin Group private for $7.7bn &mdash; a deal that is mostly equity and assumed debt, not fresh leverage, so the financing test this brief has run since 10 September stays open one day out from the vote.","matters":"\u003cp>Fed funds futures now put the odds of a quarter-point hike at Wednesday's meeting at \u003cb>94.5%\u003c/b>, up from \u003cb>87.3%\u003c/b> a day earlier, according to CME FedWatch data cited by Bloomberg &mdash; effectively a lock heading into the 14:00 ET decision and Chair Warsh's 14:30 press conference. It would be the Fed's first hike since July 2023. The blackout that began 5 September holds through the vote, so no official has been able to respond to any of the last 24 hours of news.\u003c/p>\u003cp>The bond market moved first and furthest: the 10-year Treasury yield rose to \u003cb>5.02%\u003c/b> Tuesday, clearing its own October 2023 cycle high to reach the highest level since 2007. Oil is doing part of that work &mdash; Brent was near \u003cb>$106.93\u003c/b> and WTI near \u003cb>$102.65\u003c/b> Tuesday morning &mdash; and the supply shock behind it got longer, not shorter, overnight. Monday's brief ran the U.S. energy secretary's comment that the Saudi pipeline should reopen &ldquo;soon&rdquo;; by that same afternoon, sources told the Associated Press repairs could take three to five weeks and told Reuters five to six weeks, with one independent analyst telling reporters the damage shown in satellite images could take months to fully fix. &ldquo;Soon&rdquo; was the optimistic end of a range, not a timeline.\u003c/p>\u003cp>The AI-slowdown story kept moving too, but sideways into politics rather than toward the Fed. President Trump dismissed the industry's own calls for a pause, blaming a &ldquo;SICK conspiracy&rdquo; for the voter backlash on AI data centers and arguing &ldquo;whoever wins AI, wins&rdquo; against China. Beijing responded in kind: foreign ministry spokesperson Guo Jiakun called the warnings from Amodei, Altman and Musk &ldquo;fear-mongering&rdquo; that would &ldquo;disrupt the process of global AI governance.&rdquo; U.S. equities fell Monday on the original story &mdash; the Dow, S&amp;P 500 and Nasdaq all closed lower &mdash; and futures point lower again this morning, but the disagreement is now between governments, not between the industry and its regulators.\u003c/p>\u003cp>New York's Empire State manufacturing index swung negative for the first time since June, falling to \u003cb>-8.7\u003c/b> from \u003cb>11.9\u003c/b> in August, a real domestic data point landing the same morning as the yield milestone. On the financing thread this brief has tracked since 10 September, the closest thing yet to a sponsor-financed LBO printed Monday: Sequence Holdings and Michael Dell's DFO Management agreed to take The Baldwin Group private for \u003cb>$7.7bn\u003c/b>, but roughly $4.6bn of that is equity and the debt in the deal is existing Baldwin debt being assumed or refinanced, not freshly raised acquisition leverage. Grab's same-day, all-cash purchase of a majority stake in Atome Financial for \u003cb>$1.49bn\u003c/b> is a cleaner data point for the pattern: cash is still funding deals, one day out from the vote.\u003c/p>\u003cp>\u003cb>Invalidation:\u003c/b> a Wednesday surprise &mdash; a smaller hike, a split vote, or dovish language in the Summary of Economic Projections &mdash; would matter more than usual given how one-sided positioning already is; anything short of the fully-priced 25bp move risks an outsized reaction precisely because so little probability is left on the other side.\u003c/p>","calendar":[{"time":"Wed 08:30","event":"US Retail Sales (Aug) + Business Inventories","consensus":"—","prior":"—","impact":"med"},{"time":"Wed 14:00","event":"FOMC rate decision + Summary of Economic Projections","consensus":"25bp hike, ~94% priced","prior":"—","impact":"high"},{"time":"Wed 14:30","event":"Fed chair Warsh press conference","consensus":"—","prior":"—","impact":"high"}],"alsoOnTape":"Empire State manufacturing for September printed this morning (see macro). The next scheduled U.S. data is Wednesday's retail sales and business inventories at 8:30 and 10:00 ET, both ahead of the 14:00 FOMC decision and 14:30 press conference. Blackout has been in force since 5 September and holds through the vote, so no official has been able to respond to the weekend's oil shock, this week's AI-slowdown political fallout, or today's factory data.","overnight":["\u003cb>US Monday close\u003c/b> &mdash; Dow &minus;152.09 (&minus;0.29%) to 52,421.20, S&amp;P 500 &minus;0.48% to 7,619.98, Nasdaq &minus;0.56% to 26,186.41, led down by Caterpillar (&minus;4.23%), Goldman Sachs (&minus;3.99%) and Nvidia (&minus;3.26%); Salesforce (+4.73%), IBM (+2.36%) and Alphabet (+2.15%) were the gainers, as the AI-slowdown story dominated the session.","\u003cb>Politics\u003c/b> &mdash; President Trump dismissed the AI-slowdown calls Sunday into Monday, blaming a &ldquo;SICK conspiracy&rdquo; for the voter backlash on AI data centers and saying &ldquo;whoever wins AI, wins&rdquo;; China's foreign ministry spokesperson Guo Jiakun separately called the warnings &ldquo;fear-mongering&rdquo; that would &ldquo;disrupt the process of global AI governance.&rdquo;","\u003cb>Oil\u003c/b> &mdash; the Associated Press and Reuters both reported Monday that Saudi Arabia's East-West pipeline, shut since drone strikes from Iraqi territory on 10&ndash;11 September, will likely need three to six weeks to repair; Brent was near $106.93 and WTI near $102.65 Tuesday morning, still elevated.","\u003cb>Rates\u003c/b> &mdash; the 10-year Treasury yield rose to 5.02% Tuesday, the highest since 2007 and above its own October 2023 cycle peak, as Fed funds futures put the odds of Wednesday's hike at 94.5%, up from 87.3% a day earlier.","\u003cb>This morning\u003c/b> &mdash; US equity futures pointed lower again: Dow futures &minus;0.6%, S&amp;P 500 futures &minus;0.5%, Nasdaq-100 futures &minus;0.7%, as markets head into FOMC day still digesting the AI-slowdown political fallout and rising yields.","\u003cb>Data\u003c/b> &mdash; New York's Empire State manufacturing index swung to -8.7 in September from 11.9 in August, its first negative reading since June, released this morning ahead of the FOMC."],"deals":[{"what":"Sequence Holdings and Michael Dell's family office (DFO Management) agree to take The Baldwin Group private for $7.7bn","number":"Announced 14 Sep: Baldwin shareholders get $32.50 per share in cash, an 88% premium to the 17 June unaffected price. The deal comprises roughly $4.6bn of equity purchase price plus about $3.1bn of net debt assumed or refinanced; Sequence (a VC-backed, permanent-capital holding company) and DFO are the buyers, with Baldwin employees retaining a minority stake. Expected to close Q1 2027.","readthrough":"The closest thing to a sponsor buyout since this brief started counting on 10 September, and it still isn't a clean match: the debt in the deal is existing Baldwin debt being assumed or refinanced, not new acquisition leverage raised to fund the purchase, and the buyers are a permanent-capital vehicle and a family office rather than a classic PE fund. The test &mdash; a large, freshly debt-financed sponsor LBO printing before the Fed votes &mdash; is still open with one trading day left."},{"what":"Grab Holdings agrees to buy 60% of BNPL platform Atome Financial for $1.49bn in cash","number":"Announced 15 Sep via 6-K filing: Grab will pay $1.49bn in cash for a controlling 60% stake in Atome Financial, including $0.26bn of primary growth capital as Phase 1, funded entirely from Grab's existing cash. The remaining 40% is pre-agreed to transfer roughly two years after close under a valuation formula rather than a fixed price. Expected to complete by Q3 2027.","readthrough":"A cleaner data point for the pattern than Baldwin: another acquirer paying with its own balance sheet, not a lender's, in the same week the 10-year cleared 5% for the first time since 2007. The cash-over-debt read this brief has tracked since 10 September holds again."}],"macro":["\u003cb>Fed pricing\u003c/b> &mdash; a 25bp hike Wednesday is now priced at roughly 94.5% per CME FedWatch, up from 87.3% a day earlier; it would be the first hike since July 2023. Blackout has run since 5 September and holds through the 14:00 ET vote and 14:30 press conference.","\u003cb>Rates\u003c/b> &mdash; the 10-year Treasury yield touched 5.02% Tuesday, the highest since 2007, clearing its own October 2023 cycle peak.","\u003cb>Oil / Hormuz\u003c/b> &mdash; Brent near $106.93, WTI near $102.65 Tuesday morning. The Associated Press and Reuters reported Monday that Saudi Arabia's East-West pipeline, shut since drone strikes from Iraqi territory on 10&ndash;11 September, will likely need three to six weeks to repair &mdash; longer than the &ldquo;soon&rdquo; the U.S. energy secretary floated the same day.","\u003cb>Empire State manufacturing (Sep)\u003c/b> &mdash; general business conditions fell to -8.7 from 11.9 in August, the first negative reading since June.","\u003cb>Retail sales\u003c/b> &mdash; August Advance Monthly Retail Sales and Business Inventories are due Wednesday at 8:30 and 10:00 ET, the last scheduled U.S. data before the FOMC statement."],"flow":["U.S. stocks fell Monday: Dow &minus;152.09 (&minus;0.29%) to 52,421.20, S&amp;P 500 &minus;0.48% to 7,619.98, Nasdaq &minus;0.56% to 26,186.41, led down by Caterpillar, Goldman Sachs and Nvidia; Salesforce, IBM and Alphabet were the gainers.","Futures pointed lower again Tuesday morning &mdash; Dow &minus;0.6%, S&amp;P 500 &minus;0.5%, Nasdaq-100 &minus;0.7% &mdash; heading into FOMC day with the AI-slowdown story still unresolved and yields still rising.","Gold fell to $4,263, a fresh one-month low and a third straight weekly decline, as a firmer dollar and near-certain hike odds outweigh the pipeline's escalating geopolitical risk.","Financing desk: Grab's $1.49bn all-cash purchase of a majority Atome stake and Sequence/DFO's mostly-equity purchase of Baldwin Group both leaned on cash and existing capital rather than fresh acquisition debt.","Breadth, dealer gamma, put-call and skew are paid data and are not on this page. Nothing here is positioning analysis &mdash; it is sector observation from the tape."],"levels":[],"regime":{"tag":"record long yield, hike near-lock, pipeline shock getting longer","sizing":"The 10-year has cleared its own 2023 high to the highest level since 2007 and the hike is priced above 94%, so Wednesday's SEP and Warsh's press conference, not the vote itself, are the remaining swing factors. The pipeline's now-reported three-to-six-week repair window pushes the oil shock's duration further out than Monday's 'reopen soon' framing implied."},"watchlist":[],"secondOrder":"Three threads from Monday are still running, and each moved a specific, falsifiable amount today rather than just continuing. The Fed thread firmed: CME FedWatch's odds went from roughly 86&ndash;90% Friday to 94.5% by Tuesday morning, per Bloomberg, and the 10-year didn't just approach the 2023 high, it cleared it, printing the first sub-2007 yield level in almost two decades. The AI thread got more political, not less: a sitting U.S. president and a Chinese foreign ministry spokesperson are now the ones arguing with Amodei, Altman and Musk, which is a different, more durable story than three tech CEOs agreeing with each other. And the oil thread got longer, not shorter: Monday's brief ran the U.S. energy secretary's 'soon,' and by that same afternoon the AP and Reuters were both reporting repair estimates measured in weeks, which means Wednesday's Fed decision arrives with the supply shock's timeline actually worse than it looked 24 hours earlier, not resolved. None of that changes the financing test this brief has run since 10 September: Tuesday's closest candidate, the Baldwin Group take-private, is majority equity with assumed debt, not fresh leverage, so cash is still the pattern and nothing forces that to change before tomorrow's 2pm vote.","scorecard":[{"verdict":"right","text":"The 14 September brief argued the AI-slowdown story was &ldquo;a standalone equity story, not a rates one&rdquo; with &ldquo;nothing to do with the Fed.&rdquo; That held: the story moved further from monetary policy, not closer, when President Trump called it a &ldquo;SICK conspiracy&rdquo; on 13&ndash;14 September and said &ldquo;whoever wins AI, wins,&rdquo; and China's foreign ministry spokesperson Guo Jiakun separately dismissed the CEOs' warnings as &ldquo;fear-mongering&rdquo; that would &ldquo;disrupt the process of global AI governance.&rdquo; Two governments, not central bankers, are now the story's counterparties."},{"verdict":"wrong","text":"The same brief's overnight section ran the U.S. energy secretary's Monday comment that the Saudi pipeline should reopen &ldquo;soon,&rdquo; with no independent repair estimate attached. Reporting already circulating that same day undercut it: sources told the Associated Press repairs could take three to five weeks and told Reuters five to six weeks, with one independent analyst suggesting the damage shown in satellite images could take months to fully fix. &ldquo;Soon&rdquo; was the more optimistic of two competing estimates, and the brief ran only the optimistic one."},{"verdict":"open","text":"The test set on 10 September &mdash; whether a large, freshly debt-financed sponsor buyout prints before the Fed votes &mdash; still hasn't been cleanly met or missed. Sequence Holdings and Michael Dell's DFO /* monogram + deterministic colour, so no external logo is ever needed */
var PAL = [["#0B1D3A","#fff"],["#123C6B","#fff"],["#0B7A48","#fff"],["#E4572E","#fff"],["#5B21B6","#fff"],
           ["#B45309","#fff"],["#0F4C81","#fff"],["#7C2D12","#fff"],["#134E4A","#fff"],["#3F3F46","#fff"],
           ["#1E3A8A","#fff"],["#831843","#fff"]];
function hash(s){ var h=0,i; for(i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return Math.abs(h); }
function mark(name){
  var w=name.replace(/[^A-Za-z0-9 &]/g," ").split(/\s+/).filter(Boolean);
  if(!w.length) return "?";
  if(w.length===1) return w[0].slice(0,2).toUpperCase();
  return (w[0][0]+w[1][0]).toUpperCase();
}
function mono(name){
  var c=PAL[hash(name)%PAL.length];
  return '<span class="mono" style="background:'+c[0]+';color:'+c[1]+'">'+esc(mark(name))+'</span>';
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function ago(iso){
  if(!iso) return {t:"no data yet", c:"x", ms:Infinity};
  var d=new Date(iso); if(isNaN(d)) return {t:"no data yet", c:"x", ms:Infinity};
  var ms=Date.now()-d.getTime(), m=Math.round(ms/6e4), h=Math.round(ms/36e5), dd=Math.round(ms/864e5);
  var t = m<2?"just now" : m<60?m+"m ago" : h<24?h+"h ago" : dd<7?dd+"d ago" : dd<31?Math.round(dd/7)+"w ago" : Math.round(dd/30)+"mo ago";
  var c = h<24?"h" : dd<7?"m" : dd<30?"s" : "x";
  return {t:t, c:c, ms:ms};
}

/* Where a podcast tile goes when its feed carries no per-episode link.
   data/ref.json pins the show's real Spotify page for those; anything unpinned
   falls back to a plain search. The fallback used to append "/shows" to filter
   the results by type — Spotify reads that trailing segment as the query itself
   and lands you on a search for the word "shows", so it is gone. */
function spotify(name){
  return SPOTIFY[name] || "https://open.spotify.com/search/"+encodeURIComponent(name);

function target(it){
  if(it.link) return it.link;

}

  h+='<div class="bsec"><h3>Scorecard — yesterday</h3>';
  h+= b.scorecard && b.scorecard.length ? b.scorecard.map(function(s){
        return '<div class="sc"><span class="vd '+esc(s.verdict)+'">'+esc(s.verdict)+'</span><span>'+s.text+'</span></div>';
      }).join("") : '<div class="nosrc">No prior brief to grade.</div>';
  h+='</div>';

  if(b.midday){
    h+='<div class="bsec"><h3>Midday check — '+esc(b.midday.at||"12:30 ET")+'</h3><ul>'
      + (b.midday.bullets||[]).map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>';
  } else {
    h+='<div class="bsec"><h3>Midday check</h3><div class="nosrc">Appends at 12:30 ET.</div></div>';
  }

  if(b.sources && b.sources.length){
    h+='<div class="bsec"><h3>Sources</h3><div style="font-size:12.5px;color:var(--fg-3);line-height:1.9">'
      + b.sources.map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:2px">'+esc(s.label)+'</a>';}).join(" &middot; ")
      + '</div></div>';
  }
  if(b.builtAt) h+='<div style="margin-top:22px;font-size:11.5px;color:var(--fg-3)">Built '+esc(b.builtAt)+'</div>';
  return h+'</div>';

  function sec(t,inner){ return '<div class="bsec"><h3>'+t+'</h3>'+inner+'</div>'; }
  function list(t,arr){
    return '<div class="bsec"><h3>'+t+'</h3>'
      + (arr && arr.length ? '<ul>'+arr.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>'
                           : '<div class="nosrc">Nothing material.</div>')+'</div>';
  }
};

var DEALFILTER = "All";
function dealsTable(rows){
  var head='<div class="tablewrap"><table class="deals"><thead><tr>'
    +'<th>Source</th><th>Type</th><th>Story</th><th>Industry</th><th>Region</th><th>Value</th><th>When</th>'
    +'</tr></thead><tbody>';
  var body=rows.map(function(d){
    return '<tr><td><span class="srcbadge">'+mono(d.src)+' '+esc(d.src)+'</span></td>'
      +'<td><span class="pill">'+esc(d.type)+'</span></td>'
      +'<td class="ttl"><a href="'+esc(d.link)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a></td>'
      +'<td>'+esc(d.industry)+'</td><td>'+esc(d.region)+'</td>'
      +'<td class="val">'+esc(d.value)+'</td><td style="color:var(--fg-3);white-space:nowrap">'+ago(d.date).t+'</td></tr>';
  }).join("");
  var cards='<div class="dealcards">'+rows.map(function(d){
    return '<article class="card"><a class="card-lnk" href="'+esc(d.link)+'" target="_blank" rel="noopener"></a>'
      +'<div class="card-t">'+mono(d.src)+'<div><div class="card-nm">'+esc(d.type)+'</div>'
      +'<div class="card-by">'+esc(d.src)+' &middot; '+esc(d.industry)+'</div></div></div>'
      +'<div class="card-hl">'+esc(d.title)+'</div>'
      +'<div class="card-f"><span class="fresh '+ago(d.date).c+'"><span class="dot"></span>'+ago(d.date).t+'</span>'
      +'<span class="pill">'+esc(d.region)+'</span><span class="val" style="margin-left:auto">'+esc(d.value)+'</span></div></article>';
  }).join("")+'</div>';
  return head+body+'</tbody></table>'+cards+'</div>';
}
V.deals = function(){
  if(!DEALS.length) return '<div class="empty">Deal wire is empty.<br>The morning job rebuilds it from PE Hub, Private Equity Wire, Middle Market Growth, PR Newswire M&amp;A and the four Dow Jones feeds — capped at 18, newest first.</div>';
  var types=["All"].concat(DEALS.map(function(d){return d.type;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
  var rows=DEALFILTER==="All"?DEALS:DEALS.filter(function(d){return d.type===DEALFILTER;});
  return '<div class="filters">'+types.map(function(t){
      return '<button class="chip'+(t===DEALFILTER?' on':'')+'" data-filter="'+esc(t)+'">'+esc(t)+'</button>';
    }).join("")+'</div>'+dealsTable(rows);
};

["news","macro","latam","dealdesk","podcast","writing"].forEach(function(g){
  V[g]=function(){ return gridHTML(group(g).sort(byFresh)); };
});

function refHTML(gs){
  var out="";
  gs.forEach(function(g){
    var items=REF.filter(function(r){return r.g===g;});
    out+='<section class="sec"><div class="sec-h"><h2>'+esc(REF_GROUPS[g])+'</h2><span class="n">'+items.length+'</span></div>';
    out+= items.length ? '<div class="grid">'+items.map(function(r){
      return '<article class="card"><a class="card-lnk" href="'+esc(r.link)+'" target="_blank" rel="noopener"></a>'
        +'<div class="card-t">'+mono(r.name)+'<div><div class="card-nm">'+esc(r.name)+'</div>'
        +'<div class="card-by">'+esc(r.access)+'</div></div></div>'
        +'<div class="card-hl">'+esc(r.use)+'</div></article>';
    }).join("")+'</div>' : '<div class="empty">Not imported yet — pull this group from the Research &amp; Learning Library xlsx.</div>';
    out+='</section>';
  });
  return out;
}
V.research  = function(){ return '<div class="note">Value Line and S&amp;P Capital IQ point at the public sites and will paywall you. Replace both <code>link</code> values with your FIU proxied URLs.</div>'+refHTML(["equity","data","short"]); };
V.platforms = function(){ return refHTML(["tech"]); };

V.saved = function(){
  var items=LIVE.filter(function(x){return isSaved(x.name);});
  if(!items.length) return '<div class="empty">Nothing saved.<br>Tap the bookmark on any tile. Saves live in this browser only — they do not sync.</div>';
  return gridHTML(items.sort(byFresh));
};

V.settings = function(){
  var withData=LIVE.filter(function(x){return x.date;}).length;
  var stale=LIVE.filter(function(x){ var a=ago(x.date); return a.ms>7*864e5; }).length;
  var t=localStorage&&null; /* noop */
  return '<div style="max-width:640px">'
   + row("Theme","Follows your system unless you pick one","<button class=\"btn\" id=\"tset\">Toggle</button>")
   + row("Sources on the board", LIVE.length+" tracked · "+withData+" with data · "+stale+" stale (>7d)","")
   + row("Last refresh", REFRESHED ? new Date(REFRESHED).toUTCString() : "never — no job has run against this page","")
   + row("Deal wire", DEALS.length+" stories","")
   + row("Brief", BRIEF.status==="live" ? "built "+esc(BRIEF.session||"") : "pending","")
   + row("This run", REFRESH_NOTE, "")
   + row("Saved items", SAVED.length+" on this browser","<button class=\"btn\" id=\"clr\">Clear</button>")
   + row("Mark all seen","Clears the NEW flags","<button class=\"btn\" id=\"seen\">Mark seen</button>")
   + '<div style="margin-top:24px;font-size:12.5px;color:var(--fg-3);line-height:1.7">'
   + 'Feed URLs live in this file (<code>LIVE[i].feed</code>). The refresh job reads them from here — there is no separate list to keep in sync.'
   + '</div></div>';
  function row(l,d,a){ return '<div class="setrow"><div><div class="l">'+l+'</div><div class="d">'+d+'</div></div><div class="a">'+a+'</div></div>'; }
};

/* ---------------- shell wiring ---------------- */
function counts(g){ return group(g).length; }
function buildNav(){
  var cur=route();
  document.getElementById("nav").innerHTML = ROUTES.map(function(r){
    var c = SRC[r.k] ? counts(r.k) : (r.k==="deals" ? DEALS.length : (r.k==="saved" ? SAVED.length : ""));
    return (NAVSEP[r.k]?'<div class="sep"></div>':'')
      + '<a href="#'+r.k+'" class="'+(r.k===cur?"on":"")+'">'+icon(r.k)+'<span>'+esc(r.t)+'</span>'
      + (c?'<span class="ct">'+c+'</span>':'')+'</a>';
  }).join("");
  var withData=LIVE.filter(function(x){return x.date;}).length;
  document.getElementById("foot").innerHTML =
    LIVE.length+' sources &middot; '+withData+' live<br>'
    + (REFRESHED ? 'Refreshed '+ago(REFRESHED).t : 'Never refreshed')
    + '<div class="byline">By Juan Diego Mogollon</div>';
}
function route(){
  var k=(location.hash||"#home").slice(1);
  return V[k] ? k : "home";
}
function render(){
  var k=route(), r=ROUTES.filter(function(x){return x.k===k;})[0]||ROUTES[0];
  document.getElementById("ttl").textContent=r.t;
  document.getElementById("sub").textContent=r.s;
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  var html;
  if(q){
    var hits=LIVE.filter(function(x){
      return (x.name+" "+x.by+" "+(x.topic||"")+" "+(x.title||"")).toLowerCase().indexOf(q)>-1;
    }).sort(byFresh);
    document.getElementById("ttl").textContent="Search";
    document.getElementById("sub").textContent=hits.length+' source'+(hits.length===1?'':'s')+' matching "'+q+'"';
    html=gridHTML(hits);
  } else {
    html=V[k]();
  }
  document.getElementById("view").innerHTML=html;
  buildNav();
  window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var s=e.target.closest&&e.target.closest("[data-save]");
  if(s){ e.preventDefault(); e.stopPropagation(); toggleSave(s.getAttribute("data-save")); return; }
  var f=e.target.closest&&e.target.closest("[data-filter]");
  if(f){ DEALFILTER=f.getAttribute("data-filter"); render(); return; }
  if(e.target.closest&&e.target.closest("#tset")) return setTheme(cur()==="dark"?"light":"dark");
  if(e.target.closest&&e.target.closest("#clr")){ SAVED=[]; lsSet("intake.saved",SAVED); render(); return; }
  if(e.target.closest&&e.target.closest("#seen")){ LASTSEEN=Date.now(); lsSet("intake.lastseen",LASTSEEN); render(); return; }
  if(e.target.closest&&e.target.closest(".nav a")) closeSide();
});

function cur(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a) return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  lsSet("intake.theme",t); paintThemeBtn();
}
function paintThemeBtn(){
  var d=cur()==="dark";
  document.getElementById("theme").innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'
   + (d ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>'
         : '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5"/>')
   + '</svg>';
}
var savedTheme=lsGet("intake.theme",null);
if(savedTheme) document.documentElement.setAttribute("data-theme",savedTheme);
paintThemeBtn();

function openSide(){ document.getElementById("side").classList.add("open"); document.getElementById("scrim").classList.add("on"); }
function closeSide(){ document.getElementById("side").classList.remove("open"); document.getElementById("scrim").classList.remove("on"); }
document.getElementById("burger").addEventListener("click",openSide);
document.getElementById("scrim").addEventListener("click",closeSide);
document.getElementById("theme").addEventListener("click",function(){ setTheme(cur()==="dark"?"light":"dark"); });
document.getElementById("q").addEventListener("input",render);
window.addEventListener("hashchange",render);

render();
/* stamp last-seen after the paint so this visit's NEW flags survive it */
setTimeout(function(){ lsSet("intake.lastseen", Date.now()); },1500);
</script>
</body>
