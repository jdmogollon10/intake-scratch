name: Refresh INTAKE

on:
  schedule:
    # Cron on GitHub is always UTC. 11:00 UTC is 07:00 America/New_York while
    # EDT is in force, and 06:00 once the clocks go back in November. The Claude
    # routines that write the brief drift the same way, so the two stay aligned.
    # To pin it to 07:00 year-round, add a second "0 12 * * *" entry — the run is
    # idempotent, so the extra winter run is harmless.
    - cron: "0 11 * * *"

  # Rebuild whenever a human — or the Claude routine — edits the data or the page.
  push:
    branches: [claude/quirky-davinci-fhvy4c] # this repo's default branch
    paths:
      - "data/**"
      - "src/**"
      - ".github/workflows/refresh.yml"
      # the logo, in either place build.mjs looks for it. Without these, uploading
      # a favicon commits the file but never rebuilds the page that points at it.
      - "assets/**"
      - "favicon.*"

  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data back
  pages: write # publish to GitHub Pages
  id-token: write # required by deploy-pages

# Never let a scheduled run and a push run race each other onto Pages.
concurrency:
  group: intake-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only the scheduled/manual runs go out to the feeds. A push is already
      # someone else's new data, so refetching 70 feeds would just be noise.
      - name: Refresh feeds
        id: feeds
        if: github.event_name != 'push'
        continue-on-error: true # a bad network day must not block the deploy
        run: node src/refresh-feeds.mjs

      # The M&A wire, rebuilt from the deal-carrying feeds. Mechanical extraction
      # only — it never invents a value and leaves a label blank rather than guess.
      - name: Refresh deal wire
        id: deals
        if: github.event_name != 'push'
        continue-on-error: true # a bad feed day keeps the previous wire
        run: node src/refresh-deals.mjs

      - name: Report feed outcome
        if: github.event_name != 'push'
        run: |
          if [ "${{ steps.feeds.outcome }}" = "success" ]; then
            echo "::notice::Feeds refreshed."
          else
            echo "::warning::Feed refresh failed; deploying the last good tiles unchanged."
          fi
          if [ "${{ steps.deals.outcome }}" = "success" ]; then
            echo "::notice::Deal wire rebuilt."
          else
            echo "::warning::Deal wire refresh failed; keeping the previous wire."
          fi

      # build.mjs validates before it writes, and exits non-zero on bad data,
      # so a broken page can never reach Pages.
      - name: Build page
        run: node src/build.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data index.html; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "intake-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "INTAKE: refresh $(date -u +%Y-%m-%d)"
          # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this
          # cannot loop back into the `push` trigger above.
          git push

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # the logo has to be published alongside the page or the favicon 404s.
          # Both places build.mjs looks: assets/, and the repo root (which is where
          # GitHub's drag-and-drop upload drops a file).
          if [ -d assets ]; then cp -r assets _site/assets; fi
          for f in favicon.svg favicon.png favicon.ico favicon.jpg; do
            [ -f "$f" ] && cp "$f" "_site/$f"
          done
          true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
